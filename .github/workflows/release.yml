name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Create local.properties
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "SDK dir: $SDK_DIR"
          ls "$SDK_DIR"

      - name: Prepare signing files
        run: |
          mkdir -p .signing
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > .signing/iptv-release.jks
          cat > .signing/keystore-info.properties <<EOF
          alias=${{ secrets.KEY_ALIAS }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          ls -l .signing/

      - name: Override versionName
        run: |
          sed -i "s/versionName '1.8.0'/versionName '1.8.${{ github.run_number }}'/" app/build.gradle
          grep versionName app/build.gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Find APK files
        run: find app/build/outputs/apk -name "*.apk" -type f

      - name: Generate version manifests
        run: |
          ./gradlew generateVersionFile --no-daemon \
            -PversionCodeOverride=${{ github.run_number }} \
            -PimportantUpdate=true \
            -PupdateApk32=app/build/outputs/apk/arm32/release/app-arm32-release.apk \
            -PupdateApk64=app/build/outputs/apk/arm64/release/app-arm64-release.apk \
            -PupdateApkX86=app/build/outputs/apk/x86/release/app-x86-release.apk

      - name: Show generated manifests
        run: |
          echo "=== version-lite.json ==="
          cat version-lite.json
          echo "=== version.json ==="
          cat version.json

      - name: Upload APKs and manifests
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            app/build/outputs/apk/**/*.apk
            version-lite.json
            version.json
          if-no-files-found: warn
